[workspace]
resolver = "2"
members = [
  "crates/drakestar-core",
  "crates/drakestar-cli",
  "crates/drakestar-net",
  "crates/drakestar-app",
  "crates/drakestar-rust-client",
  "crates/drakestar-native-example",
  "src-tauri",
]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/SlimefunNewHorizons/DrakeStar-Launcher"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
