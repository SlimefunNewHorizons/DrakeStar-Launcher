name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Install Frontend dependencies & build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build Tauri Desktop App & CLI
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DrakeStar Launcher ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 DrakeStar Launcher ${{ github.ref_name }} — Sovereign Multiplatform Release
            Official multi-platform build generated reproducibly via GitHub Actions CI.

            ### 📦 Binaries & Bundles
            - **Linux**: `.deb`, `.AppImage`
            - **Windows**: `.msi`, `.exe`
            - **macOS**: `.dmg` (Universal / Apple Silicon & Intel)

            ### 🛡️ Verification & Security
            Every binary is compiled with `--locked` dependencies and automated Blackwall integrity guard.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
