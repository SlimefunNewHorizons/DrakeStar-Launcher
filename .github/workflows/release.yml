name: Release

# Publicar una version: subir la version en src-tauri/tauri.conf.json, Cargo.toml (workspace) y ui/package.json,
# y empujar la etiqueta `vX.Y.Z`. Este flujo compila los instaladores de cada sistema, los firma para el
# actualizador automatico y sube `latest.json` (el que consulta la app instalada).
on:
  push:
    tags:
      - 'v*'

jobs:
  release-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: La etiqueta coincide con la version de la app
        shell: bash
        run: |
          v=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "La etiqueta ${GITHUB_REF_NAME} no coincide con la version $v de tauri.conf.json"; exit 1; }

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          for i in 1 2 3; do sudo apt-get update && break || sleep 5; done
          sudo apt-get install -y --fix-missing libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Install Frontend dependencies & build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clave minisign del actualizador (secreto del repositorio; la publica va en tauri.conf.json)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Client ID de la app de Azure aprobada por Mojang (variable del repositorio; opcional)
          DRAKESTAR_MSFT_CLIENT_ID: ${{ vars.DRAKESTAR_MSFT_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DrakeStar ${{ github.ref_name }}'
          releaseBody: |
            Launcher de Minecraft de DrakesCraft: un boton **JUGAR** que instala Java, el juego y los mods y abre Minecraft **1.20 a 26.2** con tu cuenta de Microsoft, sin premium o de Ely.by.

            ### Que cambia
            - **Catalogo Modrinth** por instancia (mods Fabric, resource packs y shaders) e **importar instancias** de otros launchers, con memoria recomendada segun tu RAM.
            - **Cuentas Ely.by** con 2FA y authlib-injector verificado, junto a Microsoft y sin premium.
            - **Diagnostico** que reune fallo, etapa, instancia y salida del juego, con vuelta a Jugar, cuentas o edicion.
            - **Fused embebido** (slimefun-solo): el servidor 26.x corre dentro del cliente cuando Fused trae el host Bukkit; si no, servidor local como siempre.
            - **Selector local/LAN** y puerto para el servidor local.
            - **El motor nativo (Horizon/DrakesRust) ya funciona en Windows** (x64 y arm64), ademas de Linux y macOS.

            Notas completas y versiones anteriores: [CHANGELOG.md](https://github.com/SlimefunNewHorizons/DrakeStar-Launcher/blob/${{ github.ref_name }}/CHANGELOG.md).

            ### Instalar
            Windows `.exe` (recomendado: instala por usuario y no pide permisos de administrador para actualizar) o `.msi`; Linux `.deb`, `.rpm` o `.AppImage`; macOS `.dmg`.

            Las versiones 0.5.x no tienen actualizador: instala esta una vez y desde aqui se actualiza sola (Ajustes, Buscar actualizaciones).
            Si Microsoft rechaza el inicio de sesion, usa una cuenta sin premium o de Ely.by mientras se aprueba la app propia.
            Guia completa: [docs/LAUNCHER.md](https://github.com/SlimefunNewHorizons/DrakeStar-Launcher/blob/${{ github.ref_name }}/docs/LAUNCHER.md).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
