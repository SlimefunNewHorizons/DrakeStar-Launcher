[package]
name = "drakestar-rust-client"
description = "Cliente Rust de DrakeStar (modo DrakesRust): handshake, login offline y lectura del flujo de paquetes"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "drakestar_rust_client"
path = "src/lib.rs"

[[bin]]
name = "drakestar-rust-client"
path = "src/main.rs"

[dependencies]
aes = "0.9.4"
flate2 = "1.0"
hex = "0.4.3"
rand = "0.10.3"
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
serde_json.workspace = true
sha1 = "0.10"
ureq = { version = "2", features = ["json"] }
