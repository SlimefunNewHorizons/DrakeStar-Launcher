[package]
name = "drakestar-app-tauri"
description = "Shell Tauri 2 de DrakeStar: expone drakestar-app como comandos IPC. Sin logica propia."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "drakestar_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "drakestar-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Sin esta feature la app intenta cargar devUrl (http://localhost:5173) incluso
# en release y falla con "Connection refused". Solo tiene sentido en release:
# en dev el CLI de Tauri la activa el solo.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
drakestar-core = { path = "../crates/drakestar-core" }
drakestar-app = { path = "../crates/drakestar-app" }
drakestar-rust-client = { path = "../crates/drakestar-rust-client" }
